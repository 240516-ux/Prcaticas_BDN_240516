name: Publicar documentacion segura de Practica03

# Preparado solamente. No se activa al hacer push ni cambia Pages automaticamente.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: practica03-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar solamente documentos publicables
        shell: bash
        run: |
          mkdir -p _site/diagramas
          cp Practica03/docs/index.html _site/
          cp Practica03/docs/diccionario_datos.html _site/
          cp Practica03/docs/diccionario_datos.csv _site/
          cp Practica03/docs/diagramas/modelo_validado.html _site/diagramas/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar bajo autorizacion manual
        id: deployment
        uses: actions/deploy-pages@v4
